spring.application.name=ai-gaming-club-management

# PostgreSQL (DB_PASSWORD must be set in the environment)
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:gaming_club}
spring.datasource.username=${DB_USERNAME:gaming_club}
spring.datasource.password=${DB_PASSWORD}

# Flyway manages the schema; Hibernate only validates it
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.sql.init.mode=never
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
